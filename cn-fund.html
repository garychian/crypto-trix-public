<body>
  <header data-site-nav></header>
  <div class="wrap">
    <div class="toolbar">
      <span class="badge badge-demo" id="data-badge">配置快照 · Snapshot</span>
      <span class="badge badge-nfa">⚠️ #NFA #DYOR</span>
      <span class="muted tiny-meta" id="asof">加载中…</span>
    </div>

    <section class="fund-head">
      <div>
        <h1 class="fund-title">A股基金 · <span class="day">人民币配置</span></h1>

      </div>
      <div class="fund-goal">
        <div class="lbl">币种 / 单位</div>
        <div class="val">CNY · 万元</div>
      </div>
    </section>

    <section class="stat-cards" id="stat-cards">
      <div class="card">
        <div class="label">总资产</div>
        <div class="value flat" id="d-total">—</div>
        <div class="sub" id="d-total-sub"></div>

      <div class="card">
        <div class="label">持仓只数</div>
        <div class="value flat" id="d-count">—</div>
        <div class="sub" id="d-count-sub"></div>
      </div>
      <div class="card">
        <div class="label">最大仓位</div>
        <div class="value flat" id="d-max">—</div>
        <div class="sub" id="d-max-sub"></div>
      </div>
      <div class="card">
        <div class="label">分类数</div>
        <div class="value flat" id="d-cats">—</div>
        <div class="sub" id="d-cats-sub"></div>
      </div>
    </section>

    <section class="panel cat-panel">
      <div class="panel-head">
        <h2>按类别配置</h2>
        <span class="muted" id="cat-summary">—</span>
      </div>
      <div class="cat-bars" id="cat-bars"></div>
      <div class="cat-tiles" id="cat-tiles"></div>
    </section>

    <section class="panel alloc-panel" id="alloc-chart" aria-labelledby="alloc-title" hidden>
      <!-- filled by allocation-chart.js -->
    </section>
    <section class="panel dividend-panel" id="cn-income-card" aria-label="分红收入"></section>

    <p class="vol-note" id="data-note">数据来自仓库 public/data/cn-fund.json · 配置快照，非实时行情 · #NFA</p>
