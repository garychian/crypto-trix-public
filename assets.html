<body>
  <header data-site-nav></header>
  <div class="wrap">
    <div class="toolbar">
      <span class="badge badge-demo" id="data-badge">实时抓取 + 约值</span>
      <span class="badge badge-nfa">⚠️ #NFA #DYOR</span>
      <span class="muted tiny-meta" id="asof">加载中…</span>
    </div>

    <section class="fund-head">
      <div>
        <h1 class="fund-title">全球资产 · <span class="day">市值排名</span></h1>
        <p class="fund-sub" id="d-sub">黄金、比特币、科技巨头，到美债与房地产——谁最大？</p>
      </div>
      <div class="fund-goal">
        <div class="lbl">单位</div>
        <div class="val">美元 USD</div>
      </div>
    </section>

    <section class="stat-cards" id="stat-cards">
      <div class="card">
        <div class="label">黄金总市值</div>
        <div class="value flat" id="c-gold">—</div>
        <div class="sub" id="c-gold-sub"></div>
      </div>
      <div class="card">
        <div class="label">加密货币总市值</div>
        <div class="value flat" id="c-crypto">—</div>
        <div class="sub" id="c-crypto-sub"></div>
      </div>
      <div class="card">
        <div class="label">最大公司</div>
        <div class="value flat" id="c-co">—</div>
        <div class="sub" id="c-co-sub"></div>
      </div>
      <div class="card">
        <div class="label">代币化 RWA（收录）</div>
        <div class="value flat" id="c-rwa">—</div>
        <div class="sub" id="c-rwa-sub"></div>
      </div>
    </section>

    <section class="panel assets-panel" id="assets-panel" aria-labelledby="assets-title">
      <div class="panel-head">
        <h2 id="assets-title">资产市值排名</h2>
        <span class="muted" id="assets-count">—</span>
      </div>
      <div class="asset-controls">
        <div class="pill-row" id="pills" role="tablist" aria-label="类别筛选"></div>
        <div class="ctl-right">
          <input class="asset-search" id="q" type="search" placeholder="搜索 名称 / 代码" autocomplete="off" aria-label="搜索资产">
          <div class="seg" id="unit-seg" role="group" aria-label="数字单位">
            <button type="button" data-unit="cn" class="on">万亿/亿</button>
            <button type="button" data-unit="en">T/B</button>
          </div>
        </div>
      </div>
      <div class="table-scroll">
        <table class="data assets-table" id="assets-table">
          <thead>
            <tr>
              <th class="l c-rank">#</th>
              <th class="l sortable" data-sort="name">名称</th>
              <th class="l c-cat sortable" data-sort="category">类别</th>
              <th class="sortable on" data-sort="mcap_usd">市值 <i class="arr"></i></th>
              <th class="sortable" data-sort="chg_24h">24h <i class="arr"></i></th>
              <th class="sortable c-1y" data-sort="chg_1y">1年 <i class="arr"></i></th>
              <th class="c-spark">走势·1年</th>
            </tr>
          </thead>
          <tbody id="assets-body"></tbody>
        </table>
      </div>
      <div class="more-row" id="more-row" hidden><button type="button" class="more-btn" id="more-btn"></button></div>
      <p class="vol-note" id="assets-note"></p>
    </section>

    <details class="panel src-panel" id="src-panel">
      <summary>数据来源（实时抓取 / 静态参考）</summary>
      <ul class="src-list" id="src-list"></ul>
    </details>

    <footer class="site-foot">
      <div>
        @<b style="color:var(--accent)">CryptoTrix1</b>
        · <a href="https://x.com/CryptoTrix1" target="_blank" rel="noopener">X</a>
        <div class="nfa">⚠️ Not financial advice · #NFA #DYOR · 公开访客视图</div>
      </div>
      <div class="nfa">全球资产 · 数据仅供参考</div>
    </footer>
  </div>
  <script type="module" src="/src/assets.js"></script>
</body>
</html>
